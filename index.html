/* Layout: today's progress and the deadline pace on top, then three subject tabs and a chapter grid where chapter size sets how much a tick is worth. */
:root {

  /* the Seneca card is its own two-column grid (briefing | counsel) so one tall side never stretches the other's rows */
  :root[data-theme="stoic"] #seneca { display: grid; grid-column: 1 / -1; grid-row: 1; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); grid-template-rows: auto auto auto auto minmax(0, 1fr); column-gap: 24px; row-gap: 0; align-items: start;
    border: 0; background: transparent; padding: 0; margin: 0 0 24px; }

  /* Daily briefing card, assembled from stacked pieces so it reads as one card */
  :root[data-theme="stoic"] .sen-head, :root[data-theme="stoic"] .sen-maxim, :root[data-theme="stoic"] .sg-brief, :root[data-theme="stoic"] .sg-risks, :root[data-theme="stoic"] .sen-acts {

  }

  :root[data-theme="stoic"] .sg-brief { grid-row: 3; padding-bottom: 6px; }

  :root[data-theme="stoic"] .sen-mark { width: 28px; height: 28px; border-radius: 2px; background: var(--st-ink); color: var(--st-marble); font-size: 15px; }

  :root[data-theme="stoic"] .sg-brief > p:first-child { font-family: var(--font-serif); font-size: 19px; line-height: 1.4; color: var(--st-ink); margin: 6px 0 16px; }
  :root[data-theme="stoic"] .sg-brief > p:nth-child(2) { display: none; }

/* =====================================================================
   ALTERNATE THEME · royal & stoic finish
   Cinzel (Roman inscription capitals) for titles and labels, Cormorant
   Garamond for statements and quotes, Spectral for reading text.
   Imperial purple, laurel gold, marble. Greek-key borders, column and
   scroll icons. Scoped to the Alternate theme only.
   ===================================================================== */
:root[data-theme="stoic"] {
  --st-imperial: #2B2140;
  --st-imperial-2: #3A2D57;
  --st-gold: #B08D3C;
  --st-gold-2: #C9A24D;
  --st-gold-deep: #7C5F22;
  --st-gold-faint: rgba(176, 141, 60, .22);
  --st-display: "Cinzel", "Trajan Pro", "Optima", Georgia, serif;
  --st-statement: "Cormorant Garamond", "EB Garamond", Georgia, serif;
  --font-ui: "Spectral", "EB Garamond", Georgia, "Times New Roman", serif;
  --font-serif: "Cormorant Garamond", "EB Garamond", Georgia, serif;
  --font-num: "Cormorant Garamond", "EB Garamond", Georgia, serif;
  --day: #3A2D57; --bar: #B08D3C;
  --bar-bg: #2B2140; --nav2: #2B2140;
  --plan: #8A5A12;
}
:root[data-theme="stoic"] body { font-family: var(--font-ui); font-size: 14px; font-feature-settings: "lnum" 1, "tnum" 1; font-variant-numeric: lining-nums tabular-nums; }
:root[data-theme="stoic"] b, :root[data-theme="stoic"] strong { font-weight: 600; }
:root[data-theme="stoic"] button, :root[data-theme="stoic"] input, :root[data-theme="stoic"] select, :root[data-theme="stoic"] textarea { font-family: var(--font-ui); }

/* ---- inscription caps for titles and labels ---- */
:root[data-theme="stoic"] h1 { font-family: var(--st-display); font-weight: 600; text-transform: uppercase; letter-spacing: .16em; font-size: 22px; }
:root[data-theme="stoic"] .eyebrow,
:root[data-theme="stoic"] #planCard .eyebrow,
:root[data-theme="stoic"] #planTimeline .eyebrow,
:root[data-theme="stoic"] .sug-fold-sum,
:root[data-theme="stoic"] .sen-head .eyebrow,
:root[data-theme="stoic"] .sg-counsel::before {
  font-family: var(--st-display); font-weight: 600; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--st-imperial);
}
:root[data-theme="stoic"] .sen-sub, .sc-h, :root[data-theme="stoic"] .sen-tgt small, :root[data-theme="stoic"] .sen-focus-info small,
:root[data-theme="stoic"] .tt-head, :root[data-theme="stoic"] .dl-stats dt {
  font-family: var(--st-display); font-weight: 600; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--st-gold-deep);
}
:root[data-theme="stoic"] .stoic-cov .sc-h { font-size: 11px; }
:root[data-theme="stoic"] .tab-name { font-family: var(--st-display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
:root[data-theme="stoic"] #planTimeline .tt-n { font-family: var(--st-display); font-weight: 700; letter-spacing: .1em; color: var(--st-gold-deep); font-size: 12px; }
:root[data-theme="stoic"] .tt-item .nm b, :root[data-theme="stoic"] .plan-list .nm b, :root[data-theme="stoic"] .sen-list ~ * { letter-spacing: .02em; }
:root[data-theme="stoic"] .tt-item .nm > b, :root[data-theme="stoic"] .plan-list .nm > span > b { font-family: var(--st-display); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--st-imperial); margin-right: 6px; }

/* ---- statements, quotes and figures in Cormorant ---- */
:root[data-theme="stoic"] .sen-maxim { font-family: var(--st-statement); font-style: italic; font-weight: 500; font-size: 20px; line-height: 1.35; color: #4A3F5C; position: relative; }
:root[data-theme="stoic"] .sg-brief > p:first-child { font-family: var(--st-statement); font-weight: 500; font-size: 21px; line-height: 1.38; color: #1F1A2B; }
:root[data-theme="stoic"] .sen-tgt strong { font-family: var(--st-statement); font-weight: 600; font-size: 34px; letter-spacing: 0; color: var(--st-imperial); }
:root[data-theme="stoic"] .sen-tgt strong i { font-family: var(--st-display); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--st-gold-deep); }
:root[data-theme="stoic"] .sen-timer { font-family: var(--st-statement); font-weight: 600; font-size: 32px; letter-spacing: .02em; color: var(--st-imperial); }

.mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: linear-gradient(145deg, #f9fafa, #b0b1b0); color: #0f0f0f; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; box-shadow: 0 6px 18px -6px rgba(249,250,250,0.35); }
h1 { font-family: var(--font-display); font-size: 1.7rem; line-height: 1.05; margin: 0; letter-spacing: -0.025em; }
.summary { margin: 8px 0 0; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.notice { margin: 16px 0 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); }

.lbl { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #7d7c79; }
.side-ctl { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 18px; border-top: 1px solid var(--line); }

.cap-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13.5px; }
.segs { display: flex; flex-direction: column; gap: 4px; }
.seg { display: flex; flex-direction: column; align-items: stretch; gap: 8px; width: 100%; padding: 11px 12px 10px; border: 0; border-radius: 12px; background: transparent; font-weight: 500; font-size: 15px; color: var(--muted); text-align: left; transition: background 0.15s, color 0.15s; }
.seg-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.seg:hover { background: rgba(255,255,255,0.05); color: var(--ink); }

.seg[aria-pressed="true"] { background: linear-gradient(90deg, #3a3938, #302f2e); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--ink); }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 26px; }
.search { flex: 1 1 260px; min-width: 0; padding: 11px 16px; border: 1px solid var(--line-2); border-radius: 12px; background: rgba(24,24,23,0.8); font-size: 15px; transition: border-color 0.15s; }
.chips { display: flex; gap: 6px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.chip { padding: 6px 14px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-weight: 600; font-size: 13px; transition: background 0.15s, color 0.15s; }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: #0f0f0f; }
.search:focus { border-color: var(--ink); outline: none; }

.group { margin-top: 28px; }
.group h2 { display: flex; align-items: center; gap: 12px; font-family: var(--font-body); font-size: 11.5px; font-weight: 700; margin: 0 0 14px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
.group h2::after { content: ""; flex: 1; height: 1px; background: var(--line); order: 2; }
.group h2 span { order: 3; font-weight: 500; letter-spacing: 0.04em; text-transform: none; color: #7d7c79; }
.none { color: var(--muted); margin-top: 28px; }

/* Chapter sheet */
.overlay {
  position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: center; justify-content: center;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.sheet { width: 100%; height: 100%; display: flex; flex-direction: column; background: radial-gradient(900px 380px at 85% -120px, rgba(255,255,255,0.06), transparent 65%), var(--bg); overflow: hidden; }
.sheet-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 22px 28px 14px; background: transparent; border-bottom: 0; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.sheet-head h2 { font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; margin: 4px 0 0; text-wrap: balance; }
.sheet-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
.save { font-size: 12px; color: var(--muted); min-height: 1.2em; }
.btn { padding: 8px 14px; border: 1px solid var(--btn-line); border-radius: 8px; background: var(--btn); color: var(--btn-ink); font-weight: 600; transition: background 0.15s, border-color 0.15s; }
.btn:hover:not(:disabled) { background: var(--btn-hover); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.primary { background: var(--pri); border-color: var(--pri); color: var(--pri-ink); }
.btn.primary:hover:not(:disabled) { background: #d8d7d3; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 0 28px 14px; font-size: 12px; color: #8b8a87; background: transparent; border-bottom: 0; }
.legend b { color: var(--ink); font-weight: 600; }
.sheet-body { flex: 1 1 auto; overflow: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-height: 120px; }
.sheet-foot { padding: 14px 28px; background: rgba(15,15,15,0.85); border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { margin: 8px 0; color: var(--muted); max-width: 52ch; }

.qz { display: flex; flex-direction: column; gap: 14px; max-width: 980px; width: 100%; margin: 0 auto; }
.qz-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.qz-modes { display: flex; gap: 18px; }
.qz-note { margin: 0; font-size: 13px; color: var(--muted); }
.qz-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.qz-chip { min-width: 34px; height: 34px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--btn-line); background: var(--btn); color: var(--btn-ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.qz-chip.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.qz-chip.right { border-color: var(--right); background: color-mix(in srgb, var(--right) 25%, var(--surface)); }
.qz-chip.wrong { border-color: var(--wrong); background: color-mix(in srgb, var(--wrong) 25%, var(--surface)); }
.qz-card { display: flex; flex-direction: column; gap: 16px; padding: 24px; border: 1px solid var(--line); border-radius: 20px; background: linear-gradient(165deg, #1f1f1e, #151514); box-shadow: 0 22px 50px -30px rgba(0,0,0,0.95); }
.qz-src { margin: 0; font-size: 12.5px; color: var(--muted); }
.qz-q { margin: 0; font-size: 1.1rem; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.qz-opts { display: grid; gap: 10px; }
.qz-opt { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); }
.qz-opt .b { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); font-size: 13px; font-weight: 600; }
.qz-opt .t { flex: 1 1 auto; min-width: 0; padding-top: 3px; white-space: pre-wrap; overflow-wrap: anywhere; }
.qz-opt .tag { flex: none; padding-top: 3px; font-size: 12px; font-weight: 600; }
.qz-opt:not(:disabled):hover { border-color: var(--accent); }
.qz-opt:disabled { cursor: default; color: var(--ink); }
.qz-opt.right { border-color: var(--right); background: color-mix(in srgb, var(--right) 20%, var(--surface)); }
.qz-opt.right .b { background: var(--right); border-color: var(--right); color: #16191a; }
.qz-opt.right .tag { color: var(--right); }
.qz-opt.wrong { border-color: var(--wrong); background: color-mix(in srgb, var(--wrong) 20%, var(--surface)); }
.qz-opt.wrong .b { background: var(--wrong); border-color: var(--wrong); color: #16191a; }
.qz-opt.wrong .tag { color: var(--wrong); }
.qz-opt.dim { opacity: 0.55; }
.fc-rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.fc-rate button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); font-weight: 600; }
.fc-rate button small { font-size: 12px; font-weight: 500; color: var(--muted); }
.fc-rate button:hover { border-color: var(--accent); }
.fc-rate .g0 { border-color: var(--wrong); }
.fc-rate .g1 { border-color: var(--warn); }
.fc-rate .g2 { border-color: var(--right); }
.fc-rate .g3 { border-color: var(--accent); }
.fc-show { align-self: stretch; padding: 14px; font-size: 16px; }
.fc-hr { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.fc-back { display: flex; flex-direction: column; gap: 12px; }
.fc-big .thumb img { height: auto; max-height: 280px; max-width: min(100%, 520px); }
.fc-ed { gap: 16px; }
.fc-side { display: flex; flex-direction: column; gap: 8px; }
.fc-ed textarea { width: 100%; min-height: 72px; resize: vertical; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); line-height: 1.5; }
.fc-ed .del { align-self: flex-start; }
.qz-fb { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.qz-fb p { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.qz-fb.right { border-color: var(--right); } .qz-fb.right strong { color: var(--right); }
.qz-fb.wrong { border-color: var(--wrong); } .qz-fb.wrong strong { color: var(--wrong); }
.qz-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.qz-score { font-family: var(--font-display); font-size: 1.6rem; margin: 0; }
.qz-list { margin: 0; padding-left: 20px; color: var(--muted); }
.nxt.due { color: var(--warn); }
.foot-r { display: flex; flex-wrap: wrap; gap: 8px; }
.foot-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.imp-overlay { z-index: 30; padding: 16px; }
.modal { width: min(100%, 880px); max-height: 100%; display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.modal-body { overflow: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; }
.modal .sheet-head, .modal .sheet-foot { flex: none; }
.imp-f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.imp-f > span { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.imp-f input[type="text"], .imp-f textarea, .imp-f select { width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.imp-f textarea { resize: vertical; min-height: 60px; line-height: 1.45; }
.imp-opt { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 4px 10px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.imp-opt .b { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); font-size: 13px; font-weight: 600; }
.imp-opt input[type="text"] { width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.imp-prev { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; grid-column: 2; }
.imp-prev img { display: block; max-width: 100%; max-height: 150px; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
.imp-check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.imp-msg { margin: 0; color: var(--muted); }
.crop-modal { width: min(100%, 1100px); height: 100%; }
.crop-tools, .crop-targets { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.crop-targets .btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.crop-stage { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: #111; flex: 1 1 auto; min-height: 200px; }
#cropCv { display: block; touch-action: none; cursor: crosshair; max-width: 100%; }
.log .opt input[type="text"] { flex: 1 1 auto; min-width: 0; }
.log .opt .mini { padding: 6px 10px; border: 1px solid var(--btn-line); border-radius: 8px; background: var(--btn); color: var(--btn-ink); font-size: 13px; font-weight: 600; white-space: nowrap; }
.mini:hover { background: var(--btn-hover); }
.optthumb { flex: none; display: flex; gap: 4px; }
.optthumb .thumb img { height: 40px; max-width: 90px; }
.qz-optimg { display: block; max-width: 100%; max-height: 200px; margin-top: 6px; border-radius: 6px; background: #fff; }
.stat { width: 100%; min-width: 600px; border-collapse: collapse; }
.stat th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.stat td { padding: 8px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: top; overflow-wrap: anywhere; }
.stat tr:last-child td { border-bottom: 0; }
.stat .num { text-align: right; }
.stat-h { font-family: var(--font-display); font-size: 1.05rem; margin: 6px 0 0; }
.stats-wrap { display: flex; flex-direction: column; gap: 10px; max-width: 1000px; width: 100%; margin: 0 auto; }
.stat-note { margin: 0; font-size: 13px; color: var(--muted); max-width: 70ch; }
.qz-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.qz-time { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); }
.qz-why { display: flex; flex-wrap: wrap; gap: 6px; }
.why { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-size: 13px; }
.why[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.qz-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.qz-ctl select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.qz-check { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted); }
.ctl-r { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; flex: 1 1 auto; justify-content: flex-end; }
.subtabs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 0 28px 14px; background: transparent; border-bottom: 1px solid var(--line); }
.stab { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border: 1px solid transparent; border-radius: 999px; background: transparent; font-weight: 600; color: var(--muted); transition: background 0.15s, color 0.15s; }
.stab:hover { color: var(--ink); }
.stab[aria-pressed="true"] { background: var(--ink); color: #0f0f0f; }
.stab .n { font-size: 12px; font-variant-numeric: tabular-nums; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); }
.stab[aria-pressed="true"] .n { background: rgba(0,0,0,0.14); color: #0f0f0f; }
.qzBtn { margin: 6px 0 6px auto; }
.qzBtn[hidden], .pill .pn[hidden] { display: none; }
.qzBtn[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--pc); }
.subnote { order: 3; width: 100%; padding: 0 0 8px; font-size: 12.5px; color: var(--muted); }
.pri { display: flex; gap: 8px; padding: 4px 4px 2px; }
.dot { --dc: var(--muted); width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid var(--dc); background: color-mix(in srgb, var(--dc) 18%, var(--surface)); }
.dot-red { --dc: var(--wrong); } .dot-yellow { --dc: var(--warn); } .dot-green { --dc: var(--right); }
.dot[aria-pressed="true"] { background: var(--dc); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--dc); }
.pri-l { display: block; padding: 0 6px 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
tr.entry[data-c="red"] td { background: color-mix(in srgb, var(--wrong) 7%, var(--surface)); }
tr.entry[data-c="yellow"] td { background: color-mix(in srgb, var(--warn) 10%, var(--surface)); }
tr.entry[data-c="green"] td { background: color-mix(in srgb, var(--right) 7%, var(--surface)); }
tr.entry[data-c="red"] td:first-child { box-shadow: inset 4px 0 0 var(--wrong); }
tr.entry[data-c="yellow"] td:first-child { box-shadow: inset 4px 0 0 var(--warn); }
tr.entry[data-c="green"] td:first-child { box-shadow: inset 4px 0 0 var(--right); }
.mini { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-size: 13px; font-weight: 600; white-space: nowrap; }
.del { align-self: end; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--muted); font-size: 13px; }
.del[data-armed="1"] { border-color: var(--wrong); color: var(--wrong); }

/* Chapter cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.tile { display: flex; flex-direction: column; justify-content: space-between; gap: 16px; min-width: 0; padding: 16px 16px 14px; border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(165deg, #1f1f1e, #151514); transition: border-color 0.18s, background 0.18s, transform 0.18s, box-shadow 0.18s; }
.tile:hover { border-color: #5d5c59; background: linear-gradient(165deg, #272726, #181817); box-shadow: 0 16px 34px -22px rgba(0,0,0,1); }
.tl { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.tl-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 22px; }
.idx { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #6f6e6b; font-variant-numeric: tabular-nums; }
.dueb { padding: 2px 9px; border-radius: 999px; background: #f9fafa; color: #0f0f0f; font-size: 11.5px; font-weight: 700; }
.tile .name { font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; overflow-wrap: anywhere; min-width: 0; cursor: pointer; }
.prog { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
.prog-t { width: 100%; height: 4px; border-radius: 999px; background: #302f2e; overflow: hidden; }
.prog-t i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #b0b1b0, #f9fafa); }
.prog-l { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.prog-lg .prog-t { flex-basis: 220px; height: 3px; }
.prog-lg .prog-l { font-size: 12.5px; }
.stats[hidden], #hist[hidden] { display: none; }
.stats { display: flex; flex-direction: column; gap: 8px; }
.tcard { --tc: var(--muted); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(160deg, #262625, #171716); }
.tcard b { order: 2; font-family: var(--font-display); font-size: 2rem; line-height: 1; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: var(--ink); }
.tcard span { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; }
.tcard span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--tc); }
.tcard-q { --tc: #f9fafa; } .tcard-c { --tc: #b0b1b0; }
#hero:empty { display: none; }
#hist { margin-top: 14px; }
.hist { padding: 20px 22px 12px; border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(170deg, #232322, #151514); box-shadow: 0 18px 40px -26px rgba(0,0,0,0.9); }
.hist-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 14px; font-size: 13px; margin-bottom: 22px; }
.hist-h > span:first-child { color: var(--ink); font-weight: 600; }
.hist-lg { display: flex; gap: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hist-lg span { display: inline-flex; align-items: center; gap: 6px; }
.hist-lg i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.hist-p { position: relative; display: flex; align-items: flex-end; gap: 6px; padding-top: 6px; border-top: 1px dashed #4e4d4b; }
.hist-max { position: absolute; right: 0; top: -9px; font-size: 11px; color: var(--muted); background: #1d1d1c; padding-left: 6px; }
.hcol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: stretch; gap: 3px; text-align: center; border-radius: 8px; padding: 0 1px 2px; }
.hbar { height: 86px; display: flex; align-items: flex-end; gap: 2px; border-bottom: 1px solid #4f5152; }
.hseg { flex: 1 1 0; min-width: 0; min-height: 3px; border-radius: 4px 4px 0 0; }
